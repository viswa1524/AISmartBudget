<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FastAPI + Gemini Budget Planner</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #090d16; color: #f1f5f9; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background: #131c2e; border: 1px solid #1e293b; border-radius: 16px; padding: 32px; max-width: 540px; width: 100%; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); }
    h1 { font-size: 24px; font-weight: 800; margin-bottom: 8px; color: #ffffff; }
    p.subtitle { font-size: 14px; color: #94a3b8; margin-bottom: 24px; }
    form { display: flex; flex-direction: column; gap: 14px; }
    .input-group label { display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; color: #64748b; margin-bottom: 6px; }
    input { width: 100%; background: #0b1120; border: 1px solid #334155; border-radius: 10px; padding: 12px 14px; color: #fff; font-size: 15px; outline: none; transition: border-color 0.2s; }
    input:focus { border-color: #10b981; }
    button { background: #10b981; color: #022c22; font-weight: 700; font-size: 15px; border: none; border-radius: 10px; padding: 14px; cursor: pointer; transition: background 0.2s; margin-top: 6px; }
    button:hover { background: #34d399; }
    .result-box { margin-top: 24px; padding: 20px; background: #0b1120; border: 1px solid #10b98144; border-radius: 12px; }
    .result-header { font-size: 13px; font-weight: 700; color: #10b981; text-transform: uppercase; margin-bottom: 8px; }
    .result-content { font-size: 14px; line-height: 1.6; color: #cbd5e1; white-space: pre-wrap; }
    .meta-badge { display: inline-block; font-size: 11px; padding: 3px 8px; border-radius: 6px; background: #1e293b; color: #94a3b8; margin-bottom: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <span class="meta-badge">FastAPI + Jinja2 + Google GenAI</span>
    <h1>AI Budget Splitter</h1>
    <p class="subtitle">Quickly split any budget allocation for any project or financial goal using Gemini 2.5 Flash.</p>

    <form action="/plan" method="post">
      <div class="input-group">
        <label for="budget">Total Budget ($)</label>
        <input id="budget" name="budget" type="number" placeholder="Budget" value="{{ budget if budget else '' }}" required>
      </div>

      <div class="input-group">
        <label for="goal">Goal or Project Name</label>
        <input id="goal" name="goal" placeholder="Living room renovation" value="{{ goal if goal else '' }}" required>
      </div>

      <button type="submit">Plan</button>
    </form>

    {% if result %}
      <div class="result-box">
        <div class="result-header">Plan Output (${{ budget }} for {{ goal }})</div>
        <div class="result-content">{{ result }}</div>
      </div>
    {% endif %}
  </div>
</body>
</html>
