<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}PocketSmart AI{% endblock %}</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<header class="navbar">
  <div class="nav-container">
    <a class="brand" href="/">
      <div class="logo-2d-box">
        <!-- 2D Premium Icon: Man with Wallet as Head -->
        <svg class="logo-2d-svg" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="40" height="40" rx="10" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.2"/>
          <!-- Credit Cards Peaking Out of Wallet Head -->
          <rect x="15" y="4" width="10" height="4.5" rx="1" fill="#F59E0B"/>
          <rect x="12.5" y="6" width="15" height="4.5" rx="1.2" fill="#0284C7"/>
          <!-- 2D Wallet Head -->
          <rect x="9" y="8.5" width="22" height="14" rx="2.8" fill="#059669"/>
          <!-- Wallet Flap & Golden Snap -->
          <path d="M21 11.5 H31 V19.5 H21 C19.9 19.5 19 18.6 19 17.5 V13.5 C19 12.4 19.9 11.5 21 11.5 Z" fill="#047857"/>
          <circle cx="21.5" cy="15.5" r="1.3" fill="#FDE047" stroke="#D97706" stroke-width="0.5"/>
          <!-- Stitching Outline -->
          <rect x="10.2" y="9.7" width="19.6" height="11.6" rx="2" fill="none" stroke="#A7F3D0" stroke-width="0.5" stroke-dasharray="1.2 1.2" opacity="0.85"/>
          <!-- Neck -->
          <path d="M18 22.5 H22 V25.5 H18 Z" fill="#CBD5E1"/>
          <!-- Man Shoulders / Suit Silhouette -->
          <path d="M7 38 C7 30.5 12.5 26.5 20 26.5 C27.5 26.5 33 30.5 33 38 Z" fill="#0B192C"/>
          <!-- Shirt Collar & Emerald Tie -->
          <path d="M17 26.5 L20 30.5 L23 26.5 Z" fill="#FFFFFF"/>
          <path d="M19.2 30 L20.8 30 L21.5 35.5 L20 37.5 L18.5 35.5 Z" fill="#059669"/>
        </svg>
      </div>

      <div class="logo-text">
        <span class="logo-main">Pocket<span>Smart</span><span class="ai-corner-tag">AI<span class="sparkle-light">✦</span></span></span>
      </div>
    </a>
    
    <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation menu" aria-expanded="false">
      <svg class="toggle-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>
    
    <nav id="main-nav">
      <a href="/">
        <svg class="nav-outline-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 10.5L12 3L21 10.5V20C21 20.5523 20.5523 21 20 21H4C3.44772 21 3 20.5523 3 20V10.5Z"/>
          <path d="M9 21V12H15V21"/>
        </svg>
        <span>Home</span>
      </a>
      <a href="/dashboard">
        <svg class="nav-outline-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="7" height="9" rx="1.5"/>
          <rect x="14" y="3" width="7" height="5" rx="1.5"/>
          <rect x="14" y="12" width="7" height="9" rx="1.5"/>
          <rect x="3" y="16" width="7" height="5" rx="1.5"/>
        </svg>
        <span>Dashboard</span>
      </a>
      <a href="/income">
        <svg class="nav-outline-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/>
          <polyline points="17 6 23 6 23 12"/>
        </svg>
        <span>Income</span>
      </a>
      <a href="/expenses">
        <svg class="nav-outline-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2" y="5" width="20" height="14" rx="2.5"/>
          <line x1="2" y1="10" x2="22" y2="10"/>
          <line x1="6" y1="15" x2="9" y2="15"/>
        </svg>
        <span>Expenses</span>
      </a>
      <a href="/budget">
        <svg class="nav-outline-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9"/>
          <circle cx="12" cy="12" r="5"/>
          <circle cx="12" cy="12" r="1.5" fill="currentColor"/>
        </svg>
        <span>Budget</span>
      </a>
      <a href="/recommendations">
        <svg class="nav-outline-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 2L14.4 8.6L21 11L14.4 13.4L12 20L9.6 13.4L3 11L9.6 8.6L12 2Z"/>
          <path d="M19 17l1 2 2 1-2 1-1 2-1-2-2-1 2-1 1-2z"/>
        </svg>
        <span>AI Insights</span>
      </a>
    </nav>
  </div>
</header>

<main class="container">
  {% block content %}{% endblock %}
</main>

<footer class="site-footer">
  <p>PocketSmart AI &mdash; Smart Budget &amp; Recommendation Assistant</p>
</footer>

<script src="/static/js/script.js"></script>
</body>
</html>
